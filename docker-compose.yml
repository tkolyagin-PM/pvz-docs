version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SA_PATH=/app/service_account.json
    volumes:
      - ./backend/service_account.json:/app/service_account.json:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://your-server-ip:8000
    depends_on:
      - backend
    restart: unless-stopped
